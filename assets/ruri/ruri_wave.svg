<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="손 흔드는 루리">
<title>루리</title>
<defs>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfcff"/><stop offset="1" stop-color="#dde5f6"/></linearGradient>
<linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a8fe0"/><stop offset=".6" stop-color="#7cc4ff"/><stop offset="1" stop-color="#bfe6ff"/></linearGradient>
<linearGradient id="blazer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e2d62"/><stop offset="1" stop-color="#2a3f82"/></linearGradient>
</defs>
<style>
.all{animation:bob 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:120px 300px}
.tail{animation:sway 3.6s ease-in-out infinite;transform-box:view-box;transform-origin:150px 58px}
.arm{animation:raise 3.6s ease-in-out infinite;transform-box:view-box;transform-origin:152px 160px}
.fore{animation:wave .9s ease-in-out infinite;transform-box:view-box;transform-origin:152px 196px}
.eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.head{animation:tilt 3.6s ease-in-out infinite;transform-box:view-box;transform-origin:120px 150px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
@keyframes raise{0%,100%{transform:rotate(-146deg)}50%{transform:rotate(-152deg)}}
@keyframes wave{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes tilt{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.6deg)}}
@media (prefers-reduced-motion:reduce){.all,.tail,.arm,.fore,.eyes,.head{animation:none}.arm{transform:rotate(-148deg)}}
</style>
<g class="all">
<!-- 그림자 -->
<ellipse cx="120" cy="306" rx="46" ry="6" fill="#000" opacity=".12"/>
<!-- 말총머리 -->
<g class="tail">
<path d="M146 54C204 36 232 92 214 154C208 178 224 200 206 232C196 206 182 192 184 164C186 124 174 86 146 74Z" fill="url(#hair)" stroke="#c3cde6" stroke-width="1.5"/>
<path d="M190 96C204 122 200 150 194 170" fill="none" stroke="#c3cde6" stroke-width="2" stroke-linecap="round"/>
</g>
<!-- 다리·신발 -->
<rect x="100" y="262" width="15" height="34" rx="6" fill="#ffe5d6"/><rect x="125" y="262" width="15" height="34" rx="6" fill="#ffe5d6"/>
<rect x="100" y="282" width="15" height="14" fill="#fff"/><rect x="125" y="282" width="15" height="14" fill="#fff"/>
<ellipse cx="106" cy="299" rx="13" ry="7" fill="#1e2d62"/><ellipse cx="134" cy="299" rx="13" ry="7" fill="#1e2d62"/>
<!-- 치마 -->
<path d="M84 222L156 222L166 272Q120 282 74 272Z" fill="#24366f"/>
<path d="M100 224L96 274M120 224L120 278M140 224L144 274" stroke="#3a5199" stroke-width="2" fill="none"/>
<!-- 몸통(블레이저) -->
<path d="M88 150Q120 138 152 150L160 230L80 230Z" fill="url(#blazer)"/>
<path d="M106 146L120 196L134 146Q120 140 106 146Z" fill="#fff"/>
<path d="M104 146L116 160L120 150ZM136 146L124 160L120 150Z" fill="#f1f4fb"/>
<path d="M116.5 160L123.5 160L127 198L120 208L113 198Z" fill="#4aa3ff"/>
<path d="M88 150L106 146L120 196L98 230L80 230Z" fill="#1b295a" opacity=".55"/>
<path d="M152 150L134 146L120 196L142 230L160 230Z" fill="#1b295a" opacity=".55"/>
<circle cx="120" cy="214" r="2.4" fill="#e9c46a"/>
<!-- 왼팔(내려 둠) -->
<path d="M88 154Q70 170 72 214L87 216Q88 188 99 172Z" fill="#24366f"/>
<circle cx="79" cy="223" r="9.5" fill="#ffe5d6"/>
<!-- 목 -->
<rect x="109" y="136" width="22" height="18" rx="8" fill="#f7d6c4"/>
<!-- 머리 -->
<g class="head">
<ellipse cx="120" cy="100" rx="66" ry="66" fill="#e4ebf8"/>
<ellipse cx="120" cy="102" rx="52" ry="50" fill="#ffe5d6"/>
<ellipse cx="86" cy="118" rx="9" ry="5.5" fill="#ffb3c0" opacity=".55"/><ellipse cx="154" cy="118" rx="9" ry="5.5" fill="#ffb3c0" opacity=".55"/>
<g class="eyes">
<ellipse cx="98" cy="104" rx="11.5" ry="13.5" fill="#fff"/><ellipse cx="142" cy="104" rx="11.5" ry="13.5" fill="#fff"/>
<ellipse cx="98" cy="106" rx="9.4" ry="11.6" fill="url(#iris)"/><ellipse cx="142" cy="106" rx="9.4" ry="11.6" fill="url(#iris)"/>
<ellipse cx="98" cy="107" rx="4.6" ry="6.2" fill="#1d3b73"/><ellipse cx="142" cy="107" rx="4.6" ry="6.2" fill="#1d3b73"/>
<circle cx="94.5" cy="101" r="3.2" fill="#fff"/><circle cx="138.5" cy="101" r="3.2" fill="#fff"/>
<circle cx="102" cy="111" r="1.6" fill="#fff" opacity=".9"/><circle cx="146" cy="111" r="1.6" fill="#fff" opacity=".9"/>
<path d="M85 99Q98 88 111 97M129 97Q142 88 155 99" fill="none" stroke="#33426e" stroke-width="3" stroke-linecap="round"/>
</g>
<path d="M88 86Q98 80 108 85M132 85Q142 80 152 86" fill="none" stroke="#aab6d4" stroke-width="2.2" stroke-linecap="round"/>
<path d="M119 116L121 120" stroke="#e9b9a6" stroke-width="2" stroke-linecap="round"/>
<path d="M110 127Q120 137 130 127Q120 132 110 127Z" fill="#e0687d" stroke="#e0687d" stroke-width="2" stroke-linejoin="round"/>
<!-- 앞머리 -->
<path d="M54 100Q50 36 120 34Q190 36 186 100Q176 72 160 68Q152 90 134 74Q120 92 106 74Q90 90 80 68Q62 74 54 100Z" fill="url(#hair)" stroke="#c3cde6" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M104 40Q96 58 100 72M124 38Q122 56 128 72M146 40Q152 56 146 70" fill="none" stroke="#c3cde6" stroke-width="1.6" stroke-linecap="round"/>
<path d="M56 98Q46 138 66 162L82 140Q70 120 74 100Z" fill="url(#hair)" stroke="#c3cde6" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M184 98Q194 138 174 162L158 140Q170 120 166 100Z" fill="url(#hair)" stroke="#c3cde6" stroke-width="1.5" stroke-linejoin="round"/>
<!-- 파란 리본 -->
<path d="M148 50L174 36L170 66Z" fill="#4aa3ff" stroke="#2f7fd6" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M148 50L130 32L124 58Z" fill="#6fb9ff" stroke="#2f7fd6" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="148" cy="50" r="6.5" fill="#2f7fd6"/>
</g>
<!-- 오른팔(손 흔들기) -->
<g class="arm">
<path d="M146 156Q160 152 160 160L158 198L144 198L142 168Z" fill="#24366f"/>
<g class="fore">
<path d="M144 194L158 194L156 228L146 228Z" fill="#24366f"/>
<rect x="143" y="224" width="16" height="5" rx="2" fill="#fff"/>
<circle cx="151" cy="238" r="10.5" fill="#ffe5d6"/>
<path d="M142 234Q138 226 144 226M160 234Q164 226 158 226" fill="none" stroke="#ffe5d6" stroke-width="5" stroke-linecap="round"/>
</g>
</g>
</g>
</svg>
