<script>/* 관리자 방문 통계용 기록(운영 도메인만). 사이트 공통 comm.js 와 같은 /api/hit 형식 */

setTimeout(function(){fetch('https://jupjup-api.sung2011103.workers.dev/api/hit',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({p:location.pathname,r:document.referrer,s:(q.get('src')||(q.get('utm_source')||'').replace(/[^a-z0-9_-]/gi,'')).slice(0,16),c:(q.get('utm_campaign')||'').replace(/[^a-z0-9_-]/gi,'').slice(0,40),v:v})}).catch(function(){})},400)}catch(e){}})();</script>
<title>루리와 함께하는 수영장 파티</title>
<style>
  :root { color-scheme: dark; --pink: #ffb3d1; --bg: #0b0b10; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; font-family: "Malgun Gothic", system-ui, sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  #game { position: relative; height: 100vh; height: 100dvh; max-width: calc(100dvh * 9 / 16); margin: 0 auto; overflow: hidden; background: linear-gradient(160deg, #1b2a4a, #3a1f4a); user-select: none; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #bg.off { display: none; }
  #keyTag { position: absolute; top: 44%; width: 100%; text-align: center; opacity: .3; font-size: 14px; }
  #hud { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; text-shadow: 0 1px 3px #000; z-index: 3; }
  #hud button { all: unset; cursor: pointer; padding: 4px 6px; }
  #bar { width: 90px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
  #bar i { display: block; height: 100%; background: var(--pink); width: 50%; transition: width .4s; }
  #box { position: absolute; left: 10px; right: 10px; bottom: 12px; min-height: 130px; padding: 14px 16px 20px; border-radius: 14px; background: rgba(10,10,20,.78); backdrop-filter: blur(4px); cursor: pointer; z-index: 2; }
  #name { font-weight: 700; color: var(--pink); margin-bottom: 6px; min-height: 1.2em; }
  #text { line-height: 1.6; font-size: 16px; white-space: pre-line; }
  #next { position: absolute; right: 14px; bottom: 8px; font-size: 12px; opacity: .7; animation: bl 1s infinite; }
  @keyframes bl { 50% { opacity: .1; } }
  #choices { position: absolute; left: 10px; right: 10px; bottom: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
  #choices button { padding: 14px; border: 1px solid var(--pink); border-radius: 12px; background: rgba(20,10,20,.88); color: #fff; font-size: 16px; }
  #choices button:hover, #choices button:focus-visible { background: var(--pink); color: #200; outline: none; }
  #timer { height: 5px; background: var(--pink); border-radius: 3px; width: 100%; transform-origin: left; }
  #timer.run { transition: transform 3s linear; transform: scaleX(0); }
  #hint { text-align: center; font-size: 13px; text-shadow: 0 1px 3px #000; }
  .panel { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(0,0,0,.72); padding: 20px; text-align: center; }
  .panel h1 { margin: 0; font-size: 28px; line-height: 1.3; }
  .panel p { margin: 0; opacity: .85; line-height: 1.6; }
  .panel button { padding: 12px 32px; font-size: 17px; border: 0; border-radius: 999px; background: var(--pink); color: #200; }
  .panel button.sub { background: transparent; color: #fff; border: 1px solid #fff6; }
  #gallery { justify-content: flex-start; background: rgba(11,11,16,.97); overflow-y: auto; }
  #gallery h2 { margin: 28px 0 0; }
  .grp { width: 100%; text-align: left; }
  .grp h3 { margin: 8px 0; font-size: 15px; color: var(--pink); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cell { aspect-ratio: 9 / 16; background: #1a1a24; border-radius: 6px; overflow: hidden; position: relative; border: 0; padding: 0; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell.locked::after { content: "🔒"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #000a; }
  .kcard { margin-bottom: 6px; }
  .khead { all: unset; display: block; width: 100%; padding: 10px 12px; box-sizing: border-box; background: #1a1a24; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .khead:disabled { opacity: .45; cursor: default; }
  .kcard .grid { margin: 6px 0 10px; }
  #viewer img { max-height: 78dvh; max-width: 100%; border-radius: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="game">
  <img id="bg" class="off" alt="">
  <div id="keyTag"></div>
  <div id="hud">
    <span>♥ <b id="aff">50</b><span id="bar"><i></i></span></span>
    <span><button id="gBtn">갤러리</button></span>
  </div>
  <div id="choices" class="hidden"></div>
  <div id="box" class="hidden"><div id="name"></div><div id="text"></div><div id="next">▶</div></div>

  <div id="title" class="panel">
    <h1>루리와 함께하는<br>수영장 파티</h1>
    <p>호감도에 따라 엔딩 4종이 갈립니다.<br>엔딩을 볼수록 갤러리가 열려요.</p>
    <button id="startBtn">시작하기</button>
    <button id="titleG" class="sub">갤러리</button>
  </div>

  <div id="endPanel" class="panel hidden">
    <h1 id="endTitle"></h1>
    <p id="endInfo"></p>
    <button id="shareBtn">공유하기</button>
    <button id="retryBtn" class="sub">다른 엔딩 보기 (막6부터)</button>
    <button id="againBtn" class="sub">처음부터</button>
    <button id="endG" class="sub">갤러리</button>
  </div>

  <div id="gallery" class="panel hidden">
    <h2>갤러리</h2>
    <p id="gInfo"></p>
    <div id="gGroups" style="width:100%"></div>
    <button id="gClose" class="sub">닫기</button>
  </div>

  <div id="viewer" class="panel hidden"><img id="vImg" alt=""><button id="vShare">공유</button><button id="vClose" class="sub">닫기</button></div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const ga = (n, p) => { try { window.gtag && gtag("event", n, p || {}); } catch (e) {} };
  const SAVE_KEY = "vn_pool_v2";
  const START_AFF = 50;       // 선택지로 얻는 총합이 -15~+37 이라 0 시작으로는 90 에 닿지 못한다
  const RETRY_ACT = 5;        // 인덱스. 막6
  const TIMER_MS = 3000;

  // ── 이야기 ───────────────────────────────────────────
  // step: {say, who, cg, min} | {choice:id, opts, timer, when}
  // min 이 붙은 대사는 그 호감도 이상일 때만 나온다
  const R = "루리";
  const ACTS = [
    [ // 막1 도착
      { who: "", say: "수영장 파라솔 아래, 루리가 손을 흔든다.", cg: "pl_wave" },
      { who: R, say: "왔네. 늦을 줄 알았는데.", cg: "pl_parasol" },
      { who: R, say: "자리 잡아뒀어. 저기 끝이 제일 시원해.", cg: "pl_stretch" },
      { choice: "A", opts: [
        { text: "\"기다렸어?\"", d: 3, reply: [R, "글쎄. 음료는 두 개 시켰지만."] },
        { text: "\"사람 많네\"", d: 1, reply: [R, "그러니까 끝자리라니까."] },
        { text: "말없이 앉는다", d: 0, reply: [R, "…뭐, 편한 대로."] },
      ] },
    ],
    [ // 막2 물놀이
      { who: R, say: "들어와. 미지근해서 들어가면 별거 아니야.", cg: "pl_swim" },
      { choice: "B", opts: [
        { text: "같이 들어간다", d: 4, cg: "pl_splash" },
        { text: "물총을 집는다", d: 3, cg: "pl_gun", reply: [R, "야. 그거 내려놔. 진심으로."] },
        { text: "발만 담근다", d: 1, cg: "pl_edge" },
      ] },
      { choice: "C", when: (s) => s.flags.B !== 2, opts: [
        { text: "물을 끼얹는다", d: (s) => (s.aff < 30 ? -2 : 2), reply: [R, "…너 지금 선 넘었어."], replyIf: (s) => s.aff < 30 },
        { text: "튜브를 밀어준다", d: 4, cg: "pl_float" },
        { text: "먼저 나온다", d: 0 },
      ] },
    ],
    [ // 막3 휴식
      { who: "", say: "선베드에 눕자 시원한 음료가 나왔다.", cg: "pl_lounge" },
      { who: "", say: "루리가 잔을 들어 올린다.", cg: "pl_drink" },
      { who: R, say: "등. 손이 안 닿아." },
      { choice: "D", opts: [
        { text: "발라준다", d: 6, cg: "pl_cream", reply: [R, "…고마워. 그만. 됐어."] },
        { text: "\"직접 해\"", d: -3, reply: [R, "치사하네."] },
        { text: "수건을 건넨다", d: 2, cg: "pl_towel2" },
      ] },
      { min: 58, who: R, say: "보지 마. …아니, 잠깐만 돌아서 있어.", cg: "ox_wet" },
    ],
    [ // 막4 간식
      { who: "", say: "그늘 아래 수박과 바비큐가 차려졌다.", cg: "pl_melon" },
      { who: "", say: "고기 굽는 냄새가 번진다.", cg: "pl_bbq" },
      { who: R, say: "하나 남았는데. 반 나눌래?", cg: "nk_hold" },
      { choice: "E", opts: [
        { text: "\"반만\"", d: 4, cg: "pl_share" },
        { text: "\"다 먹어\"", d: 3, reply: [R, "그럼 사양 안 할게."] },
        { text: "\"내가 다 먹을게\"", d: -2, reply: [R, "…너 그런 놈이었구나."] },
      ] },
    ],
    [ // 막5 사고
      { who: "", say: "젖은 타일에서 루리의 발이 미끄러진다!", cg: "pl_slip" },
      { choice: "F", timer: true, hint: "3초 안에 고르세요!", timeoutIdx: 2, opts: [
        { text: "잡는다", d: 8, cg: "pl_bump", reply: [R, "…놔. 아니, 고마워. 놔."] },
        { text: "비킨다", d: -5, cg: "pl_slip" },
        { text: "아무것도 못 한다", d: -2 },
      ] },
      { who: "", say: "차가운 물이 튀었다.", cg: "pl_cold" },
      { min: 66, who: "", say: "바람에 수건이 날아간다.", cg: "ox_towelfly" },
      { min: 66, who: "", say: "어깨끈이 흘러내린다.", cg: "ox_strap" },
      { min: 66, who: R, say: "…아무 말도 하지 마." },
    ],
    [ // 막6 친밀
      { who: "", say: "해가 진다.", cg: "pl_lean" },
      { choice: "G", opts: [
        { text: "\"조금 더 있자\"", d: 5, cg: "pl_lean" },
        { text: "\"이제 갈까\"", d: 0 },
        { text: "손을 내민다", d: (s) => (s.aff >= 72 ? 8 : -4), cg: (s) => (s.aff >= 72 ? "pl_hand" : "pl_pout") },
      ] },
    ],
    [ // 막7 밤
      { who: R, say: "폭죽 사 왔어. 한 개씩.", cg: "pl_night" },
    ],
  ];

  // 엔딩 기준은 도달 가능한 호감 범위(35~87)에 맞춰 시나리오 값(90/60/30)을 당겼다
  const ENDINGS = [
    { id: "star", min: 85, title: "별 엔딩", cg: "pl_star", who: R, say: "또 부를게. 다음엔 네가 사." },
    { id: "fire", min: 65, title: "폭죽 엔딩", cg: "pl_fire", who: R, say: "오늘 나쁘지 않았어." },
    { id: "night", min: 45, title: "야간 수영 엔딩", cg: "pl_night", who: R, say: "먼저 가. 난 좀 더 있을래." },
    { id: "dissolve", min: -999, title: "해산 엔딩", cg: "pl_pout", who: R, say: "…다음은 없을 것 같은데." },
  ];

  const GALLERY = [
    { name: "포즈", keys: ["nk_front", "nk_back", "nk_split", "nk_three", "nk_shy"], rule: "엔딩 1개", ok: (p) => p.endings.length >= 1 },
    { name: "포즈+", keys: ["nk_bend", "nk_oops"], rule: "서로 다른 엔딩 2개", ok: (p) => p.endings.length >= 2 },
    { name: "아슬아슬", keys: ["ox_towel", "ox_tie", "ox_back", "ox_press"], rule: "호감 72 이상으로 엔딩", ok: (p) => p.best >= 72 && p.endings.length >= 1 },
    { name: "아슬아슬+", keys: ["ox_hair", "ox_foam", "ox_steam", "ox_leaves", "ox_petals"], rule: "호감 85 (별 엔딩)", ok: (p) => p.endings.includes("star") },
    { name: "마지막", keys: ["ox_down", "ox_down2", "ox_bare_arm", "ox_bare_hand"], rule: "엔딩 4종 전부", ok: (p) => ENDINGS.every((e) => p.endings.includes(e.id)) },
  ];

  // ── 상태·저장 ────────────────────────────────────────
  let manifest = { order: [], cg: {} };
  let st = null;
  let timerId = null;
  let lastShare = "";

  const store = {
    get() {
      try { const v = JSON.parse(localStorage.getItem(SAVE_KEY)); if (v && Array.isArray(v.endings)) { v.seen = Array.isArray(v.seen) ? v.seen : []; return v; } } catch (e) {}
      return { endings: [], best: 0, seen: [] };
    },
    set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  };

  const newRun = (act, aff) => ({ act, i: 0, aff, flags: {}, actAff: aff, ending: null });

  // ── 이미지 ───────────────────────────────────────────
  function cgSrc(key, idx) {
    const list = manifest.cg[key];
    if (!list || !list.length) return "";
    return "img/" + (list[idx || 0] || list[0]);
  }
  function markSeen(key) {
    const p = store.get();
    if (p.seen.includes(key)) return;
    p.seen.push(key);
    store.set(p);
  }
  function show(key) {
    if (typeof key === "function") key = key(st);
    if (!key) return;
    markSeen(key);
    const src = cgSrc(key);
    $("bg").classList.toggle("off", !src);
    if (src) $("bg").src = src;
    $("keyTag").textContent = src ? "" : key;   // 아직 생성 안 된 키는 이름만 표시
  }

  // ── 진행 ─────────────────────────────────────────────
  function setAff(v) {
    st.aff = Math.max(0, Math.min(100, v));
    $("aff").textContent = st.aff;
    $("bar").firstElementChild.style.width = st.aff + "%";
  }

  function say(who, text, cg) {
    clearChoices();
    if (cg) show(cg);
    $("box").classList.remove("hidden");
    $("name").textContent = who;
    $("text").textContent = text;
    st.pending = null;
  }

  function clearChoices() {
    clearTimeout(timerId);
    $("choices").classList.add("hidden");
    $("choices").innerHTML = "";
  }

  function nextStep() {
    const act = ACTS[st.act];
    if (!act) return finish();
    while (st.i < act.length) {
      const step = act[st.i++];
      if (step.min && st.aff < step.min) continue;
      if (step.when && !step.when(st)) continue;
      if (step.choice) return showChoice(step);
      return say(step.who, step.say, step.cg);
    }
    st.act++;
    st.i = 0;
    if (st.act === RETRY_ACT) st.actAff = st.aff;
    nextStep();
  }

  function showChoice(step) {
    $("box").classList.add("hidden");
    const wrap = $("choices");
    wrap.innerHTML = "";
    wrap.classList.remove("hidden");
    if (step.timer) {
      const h = document.createElement("div"); h.id = "hint"; h.textContent = step.hint;
      const t = document.createElement("div"); t.id = "timer";
      wrap.append(h, t);
      requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("run")));
      timerId = setTimeout(() => pick(step, step.timeoutIdx), TIMER_MS);
    }
    step.opts.forEach((o, idx) => {
      const b = document.createElement("button");
      b.textContent = o.text;
      b.onclick = () => pick(step, idx);
      wrap.appendChild(b);
    });
  }

  function pick(step, idx) {
    clearChoices();
    const o = step.opts[idx];
    st.flags[step.choice] = idx;
    const d = typeof o.d === "function" ? o.d(st) : o.d;
    const reply = o.reply && (!o.replyIf || o.replyIf(st)) ? o.reply : null;
    const cg = o.cg;
    setAff(st.aff + d);
    if (reply || cg) {
      // 선택 결과를 한 줄 보여준다
      st.pendingReply = true;
      say(reply ? reply[0] : "", reply ? reply[1] : "(" + (d >= 0 ? "+" : "") + d + ")", cg);
    } else nextStep();
  }

  function finish() {
    const e = ENDINGS.find((x) => st.aff >= x.min);
    st.ending = e;
    const p = store.get();
    const first = !p.endings.includes(e.id);
    if (first) p.endings.push(e.id);
    p.best = Math.max(p.best, st.aff);
    store.set(p);
    ga("vn_ending", { ending: e.id, aff: st.aff });
    $("box").classList.add("hidden");
    say(e.who, e.say, e.cg);
    st.i = 999; st.act = ACTS.length;     // 이 대사 다음에 엔딩 패널
    st.atEnd = true;
    $("endTitle").textContent = e.title;
    $("endInfo").textContent = "호감도 " + st.aff + " · 본 엔딩 " + p.endings.length + "/4" + (first ? " · 새 엔딩!" : "");
    lastShare = "루리와 수영장 파티에서 「" + e.title + "」를 봤어요. 호감도 " + st.aff + "!";
  }

  function advance() {
    if (st.atEnd) { $("endPanel").classList.remove("hidden"); return; }
    nextStep();
  }

  function startRun(act, aff) {
    ga("vn_start", { act });
    st = newRun(act, aff);
    setAff(aff);
    ["title", "endPanel", "gallery", "viewer"].forEach((id) => $(id).classList.add("hidden"));
    nextStep();
  }

  // ── 갤러리 ───────────────────────────────────────────
  // 본문·엔딩에서 쓰는 키(플레이로 해금) — 데이터에서 뽑아 따로 적지 않는다
  const BODY_KEYS = (() => {
    const set = new Set();
    ACTS.forEach((act) => act.forEach((step) => {
      if (typeof step.cg === "string") set.add(step.cg);
      (step.opts || []).forEach((o) => { if (typeof o.cg === "string") set.add(o.cg); });
    }));
    ENDINGS.forEach((e) => set.add(e.cg));
    set.add("pl_hand"); set.add("pl_pout");   // 호감도에 따라 갈리는 컷
    return set;
  })();

  function card(key, files, unlocked) {
    const d = document.createElement("div"); d.className = "kcard";
    const head = document.createElement("button"); head.className = "khead";
    head.textContent = (unlocked ? "▸ " : "🔒 ") + key + "  (" + files.length + "장)";
    const grid = document.createElement("div"); grid.className = "grid hidden";
    if (unlocked) {
      head.onclick = () => {
        const opening = grid.classList.contains("hidden");
        if (opening && !grid.children.length) {
          files.forEach((f) => {
            const c = document.createElement("button"); c.className = "cell";
            const im = document.createElement("img"); im.loading = "lazy"; im.src = "img/" + f; im.alt = key;
            c.appendChild(im); c.onclick = () => openViewer("img/" + f);
            grid.appendChild(c);
          });
        }
        grid.classList.toggle("hidden");
        head.textContent = (opening ? "▾ " : "▸ ") + key + "  (" + files.length + "장)";
      };
    } else head.disabled = true;
    d.append(head, grid);
    return d;
  }

  function openGallery() {
    ga("vn_gallery");
    const p = store.get();
    const wrap = $("gGroups");
    wrap.innerHTML = "";
    let open = 0, total = 0;
    const used = new Set();
    const section = (title, keys, unlocked, rule) => {
      keys = keys.filter((k) => manifest.cg[k] && manifest.cg[k].length);
      if (!keys.length) return;
      const sec = document.createElement("div"); sec.className = "grp";
      const h = document.createElement("h3");
      h.textContent = title + (unlocked || !rule ? "" : " — 조건: " + rule);
      sec.appendChild(h);
      keys.forEach((k) => {
        used.add(k);
        const files = manifest.cg[k];
        total += files.length;
        if (unlocked) open += files.length;
        sec.appendChild(card(k, files, unlocked));
      });
      wrap.appendChild(sec);
    };
    // (가) 본문 키: 본문에서 지나가면 그 키 전체가 열린다
    const body = [...BODY_KEYS].filter((k) => manifest.cg[k]);
    section("본문 장면 — 본 장면", body.filter((k) => p.seen.includes(k)), true);
    section("본문 장면 — 아직 못 본 장면", body.filter((k) => !p.seen.includes(k)), false, "플레이하며 해당 장면 보기");
    // (나) 단계 해금 키
    GALLERY.forEach((g) => section(g.name, g.keys.filter((k) => !BODY_KEYS.has(k)), g.ok(p), g.rule));
    // 어디에도 안 걸린 키가 생겨도 죽지 않게 맨 아래에 연다
    section("기타", Object.keys(manifest.cg).filter((k) => !used.has(k)), true);
    $("gInfo").textContent = "해금 " + open + " / " + total + "장 · 본 엔딩 " + p.endings.length + "/4 · 최고 호감 " + p.best;
    $("gallery").classList.remove("hidden");
  }
  function openViewer(src) { $("vImg").src = src; $("viewer").classList.remove("hidden"); }

  async function share(text) {
    ga("vn_share");
    const url = location.origin + location.pathname;
    const data = { title: document.title, text: text || "루리와 수영장 파티", url };
    try {
      if (navigator.share) return await navigator.share(data);
      await navigator.clipboard.writeText(data.text + " " + url);
      alert("링크를 복사했어요");
    } catch (e) {}
  }

  // ── 연결 ─────────────────────────────────────────────
  $("box").onclick = advance;
  document.addEventListener("keydown", (e) => {
    if ((e.key === " " || e.key === "Enter") && st && !$("box").classList.contains("hidden")) advance();
  });
  $("startBtn").onclick = () => startRun(0, START_AFF);
  $("againBtn").onclick = () => startRun(0, START_AFF);
  $("retryBtn").onclick = () => startRun(RETRY_ACT, st ? st.actAff : START_AFF);
  $("shareBtn").onclick = () => share(lastShare);
  $("vShare").onclick = () => share("루리 수영장 파티 갤러리");
  ["gBtn", "titleG", "endG"].forEach((id) => ($(id).onclick = openGallery));
  $("gClose").onclick = () => $("gallery").classList.add("hidden");
  $("vClose").onclick = () => $("viewer").classList.add("hidden");

  fetch("img/cg_manifest.json", { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((m) => { manifest = m; })
    .catch(() => {});
})();
</script>
</body>
</html>
