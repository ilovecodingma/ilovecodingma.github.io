<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>루리와 함께하는 수영장 파티</title>
<style>
:root{--bg:#1b1535;--pk:#ff7ab6;--tx:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0818;color:var(--tx);font-family:-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;overscroll-behavior:none}
#app{position:relative;margin:0 auto;width:100%;max-width:480px;height:100dvh;overflow:hidden;background:var(--bg);user-select:none}
.bg{position:absolute;inset:0;transition:background .6s}
#ch{position:absolute;left:50%;bottom:150px;width:min(86%,400px);transform:translateX(-50%);transition:opacity .25s;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;z-index:5}
#hud span{background:rgba(0,0,0,.45);border-radius:999px;padding:6px 12px}
#hud button{background:rgba(0,0,0,.45);border:0;color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;min-height:36px}

#who{font-weight:900;color:var(--pk);font-size:15px;margin-bottom:6px;min-height:20px}
#tx{font-size:17px;line-height:1.65;min-height:84px}
#nx{position:absolute;right:16px;bottom:10px;color:var(--pk);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#cs{position:absolute;left:10px;right:10px;bottom:176px;display:flex;flex-direction:column;gap:10px;z-index:6}
#cs button{min-height:52px;border:1px solid rgba(255,255,255,.35);border-radius:14px;background:rgba(40,25,80,.92);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:10px 14px;text-align:left}
#cs button:active{background:var(--pk);color:#201030}
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#2a1856,#120b2a)}
.ov .cd{width:100%;max-width:380px;text-align:center}
.ov h1{font-size:26px;margin:0 0 4px}.ov p{color:#cbbcff;margin:6px 0 14px;font-size:14.5px;line-height:1.6}
.ov img{width:170px;margin:-6px auto 4px;display:block}
.ov input{width:100%;min-height:50px;margin:5px 0;border-radius:12px;border:1px solid #6b57b8;background:#1d1440;color:#fff;font:inherit;font-size:16px;padding:0 14px}
.ov .go{width:100%;min-height:54px;margin-top:8px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff7ab6,#a855f7);color:#fff;font:inherit;font-size:17px;font-weight:900}
.ov .sw{background:none;border:0;color:#cbbcff;text-decoration:underline;font:inherit;font-size:14px;min-height:44px;margin-top:6px}
#er{color:#ff9aa8;font-size:14px;min-height:20px}
#cg{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
#cg .fr{width:100%;max-width:340px;aspect-ratio:9/16;max-height:70dvh;border:2px solid var(--pk);border-radius:16px;background:#1d1440;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cg img{width:100%;height:100%;object-fit:cover}
#cg button{margin-top:14px;min-height:50px;padding:0 28px;border:0;border-radius:14px;background:var(--pk);color:#201030;font:inherit;font-weight:900;font-size:16px}
</style></head><body>
<div id="app">
 <div class="bg" id="bg"></div>
 <img id="ch" alt="">
 <div id="hud"><span>💗 호감도 <b id="af">0</b></span><button id="mn">메뉴</button></div>
 <div id="cs"></div>
 <div id="box"><div id="who"></div><div id="tx"></div><span id="nx">▼</span></div>
 <div id="cg"><div class="fr" id="cgf"></div><button id="cgx">계속</button></div>
 <div class="ov" id="gate" style="display:none"><div class="cd">
  <img src="../img/smile.webp" alt="루리">
  <h1>루리와 함께하는<br>수영장 파티</h1>
  <p id="gp">가입하면 호감도와 진행 상황이 계정에 저장돼요.<br>다음에 와도 이어서 할 수 있어요.</p>
  <input id="em" type="email" placeholder="이메일" autocomplete="email" inputmode="email">
  <input id="pw" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password">
  <div id="er"></div>
  <button class="go" id="gb">가입하고 시작하기</button>
  <button class="sw" id="sw">이미 계정이 있어요 · 로그인</button>
 </div></div>
</div>
<script>
(function () {
  var API = 'https://jupjup-api.sung2011103.workers.dev', E = function (id) { return document.getElementById(id); };

    b3: { bg: 'pool', l: [['surprise', '루리', '앗, 튜브 구멍! 바람 빠져요, 가라앉는다아!'], ['excited', '루리', '살려 줘요, 팀워크 시험이에요!']],
      c: [['제 튜브에 타요!', 3, 'b4'], ['같이 수영해서 끌어요', 2, 'b4'], ['구명조끼 가져올게요', 1, 'b4b']], ev: 1 },
    b4: { bg: 'pool', l: [['smile', '루리', '푹 젖었다… 그래도 재밌어요. 이긴 사람은 없지만 소원은 서로 하나씩 해요?']], route: 'b', ev: 1 },
    b4b: { bg: 'pool', l: [['wink', '루리', '준비성 철저하네요. 이래서 같이 오고 싶었어요.']], route: 'b' },
    c1: { bg: 'sun', l: [['smile', '루리', '해가 지고 있어요. 이 시간 수영장이 제일 예뻐요.'], ['think', '루리', '선베드 나란히 놓을까요?']],

    c2b: { bg: 'sun', l: [['excited', '루리', '좋아요! 제가 여름 플레이리스트 만들어 왔는데!']], go: 'c3' },
    c2c: { bg: 'sun', l: [['think', '루리', '앉아요, 안 잡아먹어요. 노을은 같이 보는 거예요.']], go: 'c3' },
    c3: { bg: 'dusk', l: [['think', '루리', '있잖아요, 이런 파티 처음이에요. 항상 일만 해서.'], ['smile', '루리', '오늘 불러 줄 사람이 있다는 게 좋았어요.']],
      c: [['앞으로도 자주 불러 줘요', 3, 'c4'], ['저도 오늘이 제일 좋았어요', 3, 'c4'], ['다음엔 바다 가요', 2, 'c4b']], ev: 1 },

    c4b: { bg: 'dusk', l: [['excited', '루리', '바다! 좋아요, 달력에 표시해 둘게요!']], route: 'c' },
    end: { bg: 'dusk', fin: 1 }
  };
  var st = { n: 'start', i: 0, aff: 0, seen: [], ends: 0, cgs: 0, done: [], rev: 0 }, typing = null, busy = false, CGS = [];

  function save() {
    try { localStorage.setItem('jupjup_vp', JSON.stringify(st)); } catch (e) {}
    if (!tok()) return;
    api('/api/me').then(function (m) {
      var d = m.prefs || {}; d.vp = [st.n, st.i, st.aff, st.ends, st.cgs].join('.');
      return api('/api/prefs', { data: d });
    }).catch(function () {});
  }
  function loadSave(m) {
    var v = m && m.prefs && m.prefs.vp, p;
    if (v && (p = v.split('.')) && S[p[0]]) { st = { n: p[0], i: +p[1] || 0, aff: +p[2] || 0, ends: +p[3] || 0, cgs: +p[4] || 0, seen: [], done: [], rev: 0 }; return; }
    try { var l = JSON.parse(localStorage.getItem('jupjup_vp') || 'null'); if (l && S[l.n]) { st = l; st.done = st.done || []; st.rev = st.rev || 0; st.cgs = st.cgs || 0; } } catch (e) {}

  }
  function show() {

    var im = E('ch'); var src = '../img/' + ln[0] + '.webp'; if (im.getAttribute('src') !== src) { im.style.opacity = 0; setTimeout(function () { im.src = src; im.style.opacity = 1; }, 120); }
    E('who').textContent = ln[1]; E('nx').style.visibility = 'hidden';
    type(E('tx'), ln[2], function () { E('nx').style.visibility = 'visible'; });
  }
  function adv() {

  function evOK() { return st.aff >= 2 + st.rev * 3 && CGS.length > 0; }

  var mode = 'signup';

  }
  function loadCGs(done) {
    fetch('../img/cg_manifest.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(function (m) {
      if (m && m.order && m.cg) { CGS = m.order.filter(function (k) { return m.cg[k] && m.cg[k].length; }).map(function (k) { return m.cg[k][0]; }); if (!CGS.length) throw 0; return done(); }   // 새 형식: 키별 목록, 키마다 첫 장
      var arr = Array.isArray(m) ? m : (m.items || m.cgs || []); CGS = arr.map(function (x) { return (x.file || x).toString().split('/').pop(); }).filter(Boolean); if (!CGS.length) throw 0; done();
    }).catch(function () {
