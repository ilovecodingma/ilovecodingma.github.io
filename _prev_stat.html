<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>상태창 미리보기</title>
<link rel="stylesheet" href="/assets/jam/stat.css"></head><body style="background:#05060f;margin:0;color:#eee;font-family:system-ui"><main style="max-width:760px;margin:0 auto;padding:16px">
<p style="opacity:.7;font-size:13px">미리보기: <a href="?m=guest" style="color:#0ff">비회원</a> · <a href="?m=wiz" style="color:#0ff">가입 직후(미연시)</a> · <a href="?m=low" style="color:#0ff">설정완료·낮음</a> · <a href="?m=mid" style="color:#0ff">설정완료·중간</a> · <a href="?m=high" style="color:#0ff">설정완료·높음</a></p>
<div id="jam-stat"></div></main>
<script>
(function () {
  var m = (location.search.match(/m=(\w+)/) || [0, 'wiz'])[1], n = new Date();
  function f(x) { return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); }
  var end = new Date(n); end.setDate(n.getDate() + 45), st = new Date(n); st.setDate(n.getDate() - 12);
  var K = { low: [.15, 3, 4], mid: [.55, 8, 12], high: [.85, 20, 25] }[m];
  var d = {}, q = [];
  if (K) { for (var i = 0; i < K[2]; i++) { var x = new Date(n); x.setDate(n.getDate() - i); d[f(x)] = { v: { exam: 2, spec: 1, money: K[0] > .4 ? 2 : 0, issue: K[0] > .5 ? 1 : 0, body: K[0] > .7 ? 1 : 0, dev: 1, quiz: 10, bank: 1 }, p: ['/a' + i, '/b' + i] }; if (K[1] > i) q.push({ t: Date.now() - i * 864e5, b: 'x', n: 10, s: Math.round(10 * K[0]) }); } }
  localStorage.setItem('jam_act', JSON.stringify({ d: d, q: q }));
  if (m === 'guest') { localStorage.removeItem('jupjup_tok'); }
  else { window.JAM_DEMO = { prefs: K ? { job: 'corp', goal: 'exam:korcham', gdate: f(end), gstart: f(st) } : {} }; }
})();
</script><script src="/assets/jam/stat.js"></script></body></html>
