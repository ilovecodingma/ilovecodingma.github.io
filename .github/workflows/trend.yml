name: trend
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trend
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: _trend/requirements.txt
      - run: pip install -r _trend/requirements.txt
      - run: python _trend/collect.py --if-stale 50
      - name: 데이터 커밋
        run: |
          git config user.name "trend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trend/data
          git diff --cached --quiet && exit 0
          git commit -q -m "트렌드 데이터 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 5; done
          exit 1
