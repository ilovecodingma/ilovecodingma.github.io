<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>마법사 시험</title>
<link rel="stylesheet" href="/assets/jam/stat.css"></head><body style="background:#05060f;margin:0;color:#eee;font-family:system-ui"><main style="max-width:760px;margin:0 auto;padding:16px"><div id="jam-stat"></div></main>
<script>
localStorage.removeItem('jam_act'); localStorage.removeItem('jam_hud'); localStorage.removeItem('jam_surv'); localStorage.removeItem('jam_prof');
window.JAM_DEMO = { prefs: {} };
</script>
<script defer src="/assets/jam/track.js"></script><script defer src="/assets/jam/hud.js"></script><script defer src="/assets/jam/stat.js"></script>
<script>
addEventListener('load', function () {
  document.title = 'LOADED';
  var log = [], q = function (s) { return document.querySelector(s); }, t = function () { return (q('.js-tx') || {}).textContent || ''; };
  function step(fn, ms) { return new Promise(function (r) { setTimeout(function () { try { fn(); } catch (e) { log.push('ERR ' + e.message); } document.title = 'RESULT ' + log.join(' | '); r(); }, ms); }); }
  step(function () { log.push('intro1=' + t().slice(0, 14)); q('#js-next').click(); }, 2500)
    .then(function () { return step(function () { log.push('intro2=' + t().slice(0, 12)); q('#js-next').click(); }, 1200); })
    .then(function () { return step(function () { log.push('intro3=' + t().slice(0, 8)); q('#js-next').click(); }, 1200); })
    .then(function () { return step(function () { log.push('s1=' + document.querySelectorAll('[data-job]').length + '직업'); q('[data-job="corp"]').click(); }, 1500); })
    .then(function () { return step(function () { log.push('s2 시험=' + document.querySelectorAll('[data-fam]').length + ' 목표=' + document.querySelectorAll('[data-goal]').length + ' 요청버튼=' + !!q('[data-req]')); q('[data-req]').click(); }, 1500); })
    .then(function () { return step(function () { log.push('req입력=' + !!q('#js-rq') + ' msg=' + t().slice(0, 30)); q('#js-rq').value = '정보처리기사 실기'; q('#js-rqgo').click(); }, 1500); })
    .then(function () { return step(function () { log.push('req결과=' + (q('#js-msg') || {}).textContent); q('[data-back]').click(); }, 1200); })
    .then(function () { return step(function () { q('[data-fam]').click(); }, 1500); })
    .then(function () { return step(function () { log.push('r단계=' + t().slice(0, 14) + ' 일정버튼=' + document.querySelectorAll('[data-ed]').length); var b = document.querySelector('[data-ed]:not([data-ed=""])') || q('[data-ed=""]'); b.click(); }, 1500); })
    .then(function () { return step(function () { if (q('[data-gdate]')) { log.push('s3 기한=' + document.querySelectorAll('[data-gdate]').length); q('[data-gdate]').click(); } }, 1500); })
    .then(function () { return step(function () { log.push('완료대사=' + t().slice(0, 16)); var n = q('#js-next'); if (n) n.click(); }, 1800); })
    .then(function () { return step(function () { log.push('최종=' + (q('.js-id h2') || {}).textContent + ' 목표=' + ((q('.js-goal>b') || {}).textContent || '') + ' 할일=' + document.querySelectorAll('.js-tk li').length); document.title = 'RESULT ' + log.join(' | '); }, 1500); });
});
</script></body></html>
