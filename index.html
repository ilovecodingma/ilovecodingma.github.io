<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공모왕 — 마감 임박 공모전을 한곳에서</title>
<meta name="description" content="공모왕: 문학, 아이디어·정책, 디자인, 영상, 논문, 해외 공모전을 마감 임박순으로 한곳에서 모아 보세요. 상금, 응모 자격, 접수 마감, 공식 공고 링크를 정리했습니다.">
<link rel="canonical" href="https://sungprofile.cloud/">
<meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><meta property="og:site_name" content="공모왕">
<meta property="og:title" content="공모왕 — 마감 임박 공모전을 한곳에서"><meta property="og:description" content="마감 임박 공모전을 분야별, 상금별로 한눈에."><meta property="og:url" content="https://sungprofile.cloud/gongmo/">
<meta name="theme-color" content="#c2410c">
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1c1917;--mu:#6b645d;--bd:#e7e2db;--ac:#c2410c;--acbg:#fff1e8;--ok:#166534;--okbg:#e8f5ec}
@media (prefers-color-scheme:dark){:root{--bg:#161412;--card:#201d1a;--tx:#f3efe9;--mu:#a39a90;--bd:#35302b;--ac:#fb923c;--acbg:#3a2314;--ok:#86efac;--okbg:#17301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.w{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:18px 0 10px}
h1{margin:0;font-size:20px;line-height:1.3}
h1 b{color:var(--ac)}
.sub{margin:4px 0 0;color:var(--mu);font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input[type=search],select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:40px}
input[type=search]{flex:1 1 160px;min-width:0}
select{flex:0 0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:13px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.cnt{margin:10px 0 6px;color:var(--mu);font-size:13px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:block;color:inherit;text-decoration:none}
.card:hover{border-color:var(--ac)}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.t{font-weight:700;font-size:15px;line-height:1.35;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.d{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--okbg);color:var(--ok);white-space:nowrap}
.d.hot{background:var(--acbg);color:var(--ac)}
.o{margin:2px 0 8px;color:var(--mu);font-size:12.5px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px}
dt{color:var(--mu)}dd{margin:0;overflow-wrap:anywhere}
.p{font-weight:700;color:var(--ac)}
.tags{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:11.5px;color:var(--mu);border:1px solid var(--bd);border-radius:4px;padding:0 6px}
.go{display:block;margin-top:8px;font-size:13px;color:var(--ac);font-weight:600}
.more{display:block;margin:14px auto;font:inherit;padding:10px 20px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.empty{padding:30px 0;text-align:center;color:var(--mu)}
footer{margin:28px 0 24px;padding-top:14px;border-top:1px solid var(--bd);color:var(--mu);font-size:12.5px;text-align:center}
footer p{margin:4px 0}
footer a{color:var(--mu)}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4248498719773262" crossorigin="anonymous"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G9BPFF95GY"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-G9BPFF95GY');</script>
</head><body>
<div class="w">
<header><h1><b>공모왕</b> — 마감 임박 공모전을 한곳에서</h1><p class="sub" id="upd">불러오는 중…</p></header>
<div class="bar">
<div class="row">
<input type="search" id="q" placeholder="공모전, 주최, 키워드 검색" aria-label="검색">
<select id="due" aria-label="마감"><option value="">마감 전체</option><option value="7">이번 주 (7일 이내)</option><option value="31">이번 달 (30일 이내)</option></select>
<select id="sort" aria-label="정렬"><option value="end">마감 임박순</option><option value="prize">상금 큰 순</option></select>
</div>
<div class="chips" id="chips" role="group" aria-label="분야"></div>
</div>
<p class="cnt" id="cnt" aria-live="polite"></p>
<ul id="list"></ul>
<button class="more" id="more" hidden>더 보기</button>
<footer>
<p>정보는 자동 수집되며 정확한 요강은 주최측 공고를 확인하세요</p>
<p><a href="https://www.youtube.com/@%EB%B0%95%EC%84%B1%EC%83%81-u2e" target="_blank" rel="noopener">유튜브</a> · <a href="https://www.instagram.com/seongsang.park94/" target="_blank" rel="noopener">인스타그램</a></p>
</footer>
</div>
<script>
(function(){
var CATS=['전체','문학','아이디어·정책','디자인','영상','논문','IT·과학','해외','기타'];
var PAGE=40,shown=PAGE,cat='전체',items=[],todayN;
var $=function(i){return document.getElementById(i)};
function dnum(s){var p=s.split('-');return Math.round(Date.UTC(+p[0],p[1]-1,+p[2])/864e5)}
var n=new Date();todayN=Math.round(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5);
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function dd(s){return s.replace(/-/g,'.')}
var chips=$('chips');
CATS.forEach(function(c){var b=el('button','chip',c);b.type='button';b.setAttribute('aria-pressed',c==='전체');b.onclick=function(){cat=c;[].forEach.call(chips.children,function(x){x.setAttribute('aria-pressed',x===b)});shown=PAGE;render()};chips.appendChild(b)});
['q','due','sort'].forEach(function(i){$(i).addEventListener('input',function(){shown=PAGE;render()})});
$('more').onclick=function(){shown+=PAGE;render()};
function render(){
  var q=$('q').value.trim().toLowerCase(),due=+$('due').value||0,sort=$('sort').value;
  var r=items.filter(function(i){
    if(i.left<0)return false;
    if(cat!=='전체'&&i.tags.indexOf(cat)<0)return false;
    if(due&&i.left>(due===7?7:30))return false;
    if(q&&i.hay.indexOf(q)<0)return false;
    return true});
  r.sort(sort==='prize'?function(a,b){return b.pv-a.pv||a.left-b.left}:function(a,b){return a.left-b.left||b.pv-a.pv});
  $('cnt').textContent='공모전 '+r.length+'건';
  var ul=$('list');ul.textContent='';
  if(!r.length){var li=el('li','empty','조건에 맞는 공모전이 없어요.');ul.appendChild(li)}
  r.slice(0,shown).forEach(function(i){
    var li=document.createElement('li'),a=el('a','card');
    a.href=i.link;a.target='_blank';a.rel='noopener nofollow';
    var top=el('div','top');top.appendChild(el('h2','t',i.title));
    var l=i.left;top.appendChild(el('span','d'+(l<=7?' hot':''),l===0?'D-DAY':'D-'+l));
    a.appendChild(top);a.appendChild(el('p','o',i.org));
    var d=document.createElement('dl');
    function row(k,v,c){d.appendChild(el('dt',null,k));d.appendChild(el('dd',c,v))}
    row('상금',i.prize,i.pv?'p':'');
    row('접수',(i.start?dd(i.start)+' ~ ':'~ ')+dd(i.end)+' 마감');
    row('자격',i.elig);
    a.appendChild(d);
    var t=el('div','tags');i.tags.forEach(function(x){t.appendChild(el('span','tg',x))});a.appendChild(t);
    a.appendChild(el('span','go','공식 공고 보기 →'));
    li.appendChild(a);ul.appendChild(li)});
  $('more').hidden=r.length<=shown;
}
fetch('/gongmo/data.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
  items=d.items.map(function(i){i.left=dnum(i.end)-todayN;i.hay=(i.title+' '+i.org+' '+i.field+' '+i.elig+' '+i.tags.join(' ')).toLowerCase();return i});
  $('upd').textContent='마감 전 공모전 '+items.filter(function(i){return i.left>=0}).length+'건 · '+d.updated.slice(0,10)+' 갱신';
  render();
}).catch(function(){$('upd').textContent='데이터를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'});
})();
</script>
</body></html>
